replicaCount: 1

# Keep enough ReplicaSets for short rollback history without accumulating the
# Kubernetes default of ten revisions across frequent maintenance deployments.
revisionHistoryLimit: 3

# Require sustained readiness before a new Pod is counted as available. This
# prevents a single transient readiness success from completing the rollout.
minReadySeconds: 5

deploymentStrategy:
  # Recreate avoids RWO PVC multi-attach stalls during single-replica upgrades.
  type: Recreate

image:
  repository: ghcr.io/frobobbo/wp_fleet_ops
  # The default tag is mutable. Pull on every Pod start so a rollout cannot
  # silently reuse an older node-cached image. Immutable tags may override this.
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The application does not call the Kubernetes API. Keep credentials out of the
# Pod unless an operator explicitly opts into token mounting.
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  # Retained SQLite history can grow over time. Only relabel the volume when its
  # root ownership is wrong instead of recursively walking it on every rollout.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wp-fleet-ops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  # Preserve the SQLite PVC when the Helm release is removed. Set false only
  # when release deletion is intentionally allowed to delete FleetOps history.
  keep: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""

config:
  dataDir: /data
  # Set to the deployed Git SHA so health/readiness responses identify the
  # exact source revision even when using a mutable image tag or source bundle.
  revision: unknown

# Development/bootstrapping mode for clusters where the final app image has
# not been pushed yet. Create a ConfigMap containing app.tar.gz and set this to
# true; the chart will unpack and run the source with a stock Python image.
sourceBundle:
  enabled: false
  configMapName: ""
  fileName: app.tar.gz
  mountPath: /work
  pythonImage: python:3.13-slim
  prepareCommand: "mkdir -p /work/app /work/site && tar -xzf /bundle/app.tar.gz -C /work/app && chmod -R a+rX /work/app && python -m pip install --no-cache-dir --target /work/site /work/app && chmod -R a+rX /work/site"
  runCommand: "PYTHONPATH=/work/site:/work/app python -m uvicorn wp_fleet_ops.main:app --host 0.0.0.0 --port 8000"

# Give image startup and source-bundle dependency installation up to three
# minutes before liveness checks may restart the container. Readiness proves
# that the SQLite data volume is readable and writable before startup succeeds.
startupProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
