apiVersion: v1
kind: Pod
metadata:
  name: '{{ include "wp-fleet-ops.fullname" . }}-test-connection'
  labels:
    helm.sh/chart: '{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}'
    app.kubernetes.io/component: helm-test
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 120
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ['/bin/sh', '-ec']
      args:
        - |
          base_url="http://{{ include "wp-fleet-ops.fullname" . }}:{{ .Values.service.port }}"
          wget -qO- "${base_url}/ready" | grep -q '"status":"ready"'
          wget -qO- "${base_url}/" | grep -q 'WP FleetOps'
          wget -qO- "${base_url}/report" | grep -q 'WP FleetOps Maintenance Report'
